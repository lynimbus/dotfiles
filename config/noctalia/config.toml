# Noctalia V5 配置 — 本机适配版 (2026-08-13)
# 来源: NyxNiri v2/noctalia/noctalia-config.toml, 按本机修改:
#   - 移除 mpvpaper 插件/组件 (未安装 AUR mpvpaper)
#   - 移除 nyxmellow fcitx5 皮肤模板 (可选模块, 需要时装回)
#   - 移除作者专属 battery_hidpp 设备
#   - idle lock_and_suspend 禁用 (本机休眠有坑, 见 AGENTS.md, 勿自动挂起)
#   - wallpaper 目录改为本机路径
# 注意: 此文件由 Noctalia 在设置变更时写回, 是"应用状态"而非纯声明配置。
# 重新部署: cp ~/nix-config/config/noctalia/config.toml ~/.config/noctalia/

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.68999998457729816
tint_intensity = 0.0

[bar]
order = ["bar"]

[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.79
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.95999998226761818
enabled = true
panel_overlap = 12
font_family = "JetBrains Mono"
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
end = [
    "media",
    "tray",
    "wallpaper",
    "volume",
    "notifications",
    "session",
]
center = ["clock"]
start = ["launcher", "workspaces", "active_window"]
thickness = 36

[brightness]
enable_ddcutil = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000003"]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000003]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 720.0
rotation = 0.0
type = "fancy_audio_visualizer"

[desktop_widgets.widget.desktop-widget-0000000000000003.settings]
background = false
visualization_mode = "wave_rings"

[dock]
auto_hide = false
enabled = true
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    # 本机禁用自动挂起: 双显卡休眠有坑 (唤醒后键盘失灵), 见 AGENTS.md
    # [idle.behavior.lock-and-suspend]
    # action = "lock_and_suspend"
    # enabled = true
    # timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 360.0

[hooks]
theme_mode_changed = ["~/.config/noctalia/theme-sync.sh"]
wallpaper_changed = ["~/.config/noctalia/wallpaper-hook.sh"]

[hot_corners.bottom_right]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[location]
custom_schedule = false

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[osd]
background_opacity = 0.84999998100101948
offset_y = 20
position = "bottom_center"
scale = 0.90000000596046448

[osd.kinds]
media = false
nightlight = false

[shell]
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

[shell.greeter_sync]
auto_sync = true
privilege_command = "pkexec"

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_right"
session_placement = "floating"
session_position = "center"
transparency_mode = "soft"
wallpaper_placement = "floating"
wallpaper_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[[shell.session.actions]]
action = "command"
command = "notify-send 'Noctalia' 'Custom session entry'"
countdown_seconds = 0.0
enabled = false
variant = "default"

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["qt", "starship"]
community_ids = []

[wallpaper]
directory = "/home/lynimbus/Pictures/Wallpapers"
fill_mode = "crop"
