# The `ollama` system user, previously provided by Fedora's ollama-base
# package. build_files/build.sh now takes the ollama payload from the pinned
# upstream release (Fedora's 0.24.0 is too old for the configured model), so
# the user/group definition has to ship with the image.
#
# Same fields as the Fedora package: system user, home /var/lib/ollama
# (created at runtime by the tmpfiles.d entry and the unit's
# StateDirectory=), no login shell.
u ollama - "Runs Ollama" /var/lib/ollama /sbin/nologin
