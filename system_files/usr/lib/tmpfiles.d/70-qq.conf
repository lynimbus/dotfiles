# /usr/lib/tmpfiles.d/70-qq.conf
#
# WHY: /opt is a symlink to /var/opt on this base image and /var is machine
# state the build must not write, so the image cannot ship /opt/QQ itself.
# Tencent's payload lives in /usr/lib/QQ (immutable, deployed by OSTree); this
# rule recreates the /opt/QQ symlink at every boot, which is the path both the
# Wayland fix and QQ's own launcher hardcode (resources/app lives underneath).
L+ /var/opt/QQ - - - - /usr/lib/QQ
