# /usr/lib/tmpfiles.d/atomic-workstation-ollama.conf
#
# The Fedora ollama-base package creates /var/lib/ollama from its %post, which
# ostree does not replay on `bootc switch`: /var is machine state, so a freshly
# switched deployment has no such directory and the unit (User=ollama,
# StateDirectory= see the drop-in) would have to create it itself. Declaring it
# here makes systemd-tmpfiles create it with the right ownership on every boot,
# and satisfies `bootc container lint` (content under /var must have a
# tmpfiles.d entry).

d /var/lib/ollama 0755 ollama ollama - -
