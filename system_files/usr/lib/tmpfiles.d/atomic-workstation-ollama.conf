# /var is machine state: ostree does NOT deploy it, so a freshly switched
# deployment has no /var/lib/ollama. The unit runs as User=ollama and (via the
# atomic-workstation drop-in) has StateDirectory=ollama, which would create it
# anyway; declaring it here makes systemd-tmpfiles create it with the right
# ownership on every boot and satisfies `bootc container lint` (content under
# /var must have a tmpfiles.d entry).

d /var/lib/ollama 0755 ollama ollama - -
