<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Maple Mono NF CN is the terminal font. ghostty (font-family = Maple Mono
    NF CN) and foot (font = Maple Mono NF CN) ask for it by family name, so
    the language tags removed below do not affect them in any way.

    Why remove them: the font declares ja / zh-cn / zh-sg, and its CJK glyphs
    advance 1.2em — two 0.6em Latin cells. That is exactly right for a
    monospace terminal grid and 20% too wide for running text (Noto Sans CJK
    advances 1.0em). Maple's charset is larger than Noto CJK's, so fontconfig
    preferred it for every *generic* CJK lookup: sans-serif, serif and
    monospace with lang=zh-cn all resolved to "Maple Mono NF CN" instead of
    Noto. In a browser that renders every Chinese character 20% too wide,
    which reads as "big gaps between the characters".

    On the host this is masked by Fedora's "prefer Noto CJK" rules
    (65-google-noto-sans-cjk-fonts.conf, 69-nonlatin.conf, …) in
    /etc/fonts/conf.d. Flatpak apps do not use the host's /etc/fonts — they
    get the runtime's own, which carries upstream fontconfig defaults and has
    no Noto-CJK preference at all. So the bug appeared only in the browser
    (org.mozilla.firefox, runtime 25.08), never on the host.

    Removing the tags leaves every glyph in place: the font still renders CJK
    when it is asked for by name, it just stops competing for generic CJK
    fallback. Noto Sans CJK SC / Noto Serif CJK SC / Noto Sans Mono CJK SC
    win those instead.

    This is a scan-time edit, so it is baked into the font cache that
    fc-cache builds in build_files/build.sh. Flatpak bind-mounts that cache
    read-only as /run/host/fonts-cache, which is how this reaches flatpak
    apps as well — verified: Noto Sans CJK SC's Fedora-side "ja" stripping
    (a scan-time edit in the same /etc/fonts/conf.d) is visible inside the
    sandbox even though the sandbox has no such conf file.
  -->
  <match target="scan">
    <test name="family"><string>Maple Mono NF CN</string></test>
    <edit name="lang" mode="assign">
      <minus>
        <name>lang</name>
        <langset>
          <string>ja</string>
          <string>zh-cn</string>
          <string>zh-sg</string>
        </langset>
      </minus>
    </edit>
  </match>
</fontconfig>
