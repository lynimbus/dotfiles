# Port of system/input-method.nix (main branch): fcitx5 with the Wayland
# frontend. environment.d applies to every systemd user session (niri and
# KDE alike). rime-ice data is user state — install it to
# ~/.local/share/fcitx5/rime (see docs/nixos-port-map.md).

GTK_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
XMODIFIERS=@im=fcitx
