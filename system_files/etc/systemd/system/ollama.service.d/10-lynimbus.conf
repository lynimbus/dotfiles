# Port of system/ollama.nix (main branch).
#
# The NixOS module ran the ollama-vulkan build; Fedora ships the standard
# ollama package (CUDA/CPU backends) — on this NVIDIA machine it uses CUDA
# via the driver from the base image. OLLAMA_VULKAN is kept commented since
# the Fedora build has no Vulkan backend. Models are runtime state:
# `ujust atomic-ws-ollama-pull` fetches the kev:4b model.

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NO_CLOUD=1"
# Environment="OLLAMA_VULKAN=1"
DeviceAllow=char-drm
DeviceAllow=char-nvidia
