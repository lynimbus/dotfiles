# Port of system/ollama.nix (main branch).
#
# Deviation from main: Fedora cannot ship a CUDA build (no closed-source
# toolkit), so the GPU path here is Vulkan — `ollama-vulkan` supplies
# libggml-vulkan.so and OLLAMA_VULKAN=1 switches the runtime to it. Only
# ollama-base + ollama-vulkan are installed, NOT the `ollama` meta package:
# the meta hard-requires ollama-rocm, which drags in ~5.9 GB of AMD ROCm
# libraries (rocm-llvm-static, rocblas, rocsolver) that are dead weight on
# this NVIDIA machine.
#
# Models are runtime state: `ujust atomic-ws-ollama-pull` fetches the model.

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_CONTEXT_LENGTH=8192"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_NO_CLOUD=1"
Environment="OLLAMA_VULKAN=1"

# /var/lib/ollama is machine state, and ostree does NOT deploy /var: without
# this the unit's User=ollama has no HOME and `ollama serve` cannot create
# it, so a freshly switched deployment crash-loops. StateDirectory= creates
# and owns the directory (and satisfies `bootc container lint`).
StateDirectory=ollama

# Same list as the NixOS module. Note that any DeviceAllow= turns the unit
# into a strict device-cgroup whitelist, so the full set has to be here.
DeviceAllow=char-drm
DeviceAllow=char-nvidia
DeviceAllow=char-nvidiactl
DeviceAllow=char-nvidia-uvm
DeviceAllow=char-nvidia-caps
DeviceAllow=char-nvidia-modeset
