# ~/.config/pipewire/pipewire.conf.d/99-autogain.conf — port of
# home/audio/rnnoise.nix (main branch).
#
# Deviation: the NixOS config chained dyson compress (auto gain) with an
# rnnoise LADSPA noise-suppressor node. Fedora packages the dyson compressor
# (ladspa-swh-plugins) but NOT the werman/rnnoise LADSPA plugin (its rnnoise
# package ships only the library). The rnnoise node is kept below, commented;
# to re-enable it, build rnnoise-plugin from source into a LADSPA path and
# uncomment the node + fix its plugin path. For a packaged alternative use
# EasyEffects (Fedora repo) whose Noise Reduction plugin is RNNoise-based.
#
# Both plugin paths are Fedora's /usr/lib64/ladspa (nixpkgs used its own
# store paths).
#
# `flags = [ ifexists nofail ]` matters before the custom image is booted:
# `chezmoi apply` usually happens on the stock Bazzite install first, where
# ladspa-swh-plugins (and therefore dyson_compress_1403.so) does not exist
# yet, and a hard module-load failure there takes the whole PipeWire daemon
# down — i.e. no sound at all. With nofail the module loads, logs the missing
# plugin and the rest of the graph keeps working.

context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ ifexists nofail ]
    args = {
      node.description = "Auto Gain Source"
      media.name = "Auto Gain Source"

      filter.graph = {
        nodes = [
          {
            type = ladspa
            name = gain_control
            plugin = "/usr/lib64/ladspa/dyson_compress_1403.so"
            label = dysonCompress
            # These are the ports this plugin ACTUALLY exposes (verify with
            # `analyseplugin /usr/lib64/ladspa/dyson_compress_1403.so`). The
            # main branch's config named them "Input Gain"/"Threshold"/
            # "Ratio"/"Attack Time"/"Makeup Gain", which the plugin has
            # never had — PipeWire dropped every one of them with
            # "control … can not be set", so the compressor ran on defaults.
            # The two ratios are 0..1, not dB.
            control = {
              "Peak limit (dB)" = -6.0
              "Release time (s)" = 0.2
              "Fast compression ratio" = 0.6
              "Compression ratio" = 0.6
            }
          }
          # {
          #   type = ladspa
          #   name = rnnoise
          #   plugin = "/usr/lib64/ladspa/librnnoise_ladspa.so"
          #   label = noise_suppressor_mono
          #   control = {
          #     "VAD Threshold (%)" = 80.0
          #     "VAD Grace Period (ms)" = 200
          #     "Retroactive VAD Grace (ms)" = 0
          #   }
          # }
        ]
      }

      capture.props = {
        node.name = capture.autogain_source
        node.passive = true
        audio.rate = 48000
      }

      playback.props = {
        node.name = autogain_source
        media.class = Audio/Source
        audio.rate = 48000
      }
    }
  }
]
