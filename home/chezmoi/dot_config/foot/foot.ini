# ~/.config/foot/foot.ini — atomic-workstation
#
# Managed by chezmoi. foot is the terminal shipped in the image; these are
# the user's preferences ported from home/programs/ghostty.nix (Maple Mono
# font, translucent dark background).
#
# Verified against foot 1.28 (foot.ini(5)):
#   * the colour sections are [colors-dark] / [colors-light], NOT [colors]
#   * colours are plain 6-digit RRGGBB — no alpha component; transparency is
#     the separate "alpha" option
#   * scrollback-* key bindings need no override: Shift+PageUp/PageDown
#     already map to scrollback-up/down-half-page
# No "include=" line: foot aborts on unknown options, and pulling in a
# distro-wide foot.ini would silently override everything below.

[main]
font=Maple Mono NF CN:size=13
pad=8x8

[colors-dark]
background=1e1e2e
foreground=cdd6f4
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8
# background transparency (ported from ghostty's background-opacity = 0.93)
alpha=0.93
# cursor colours live HERE (text colour, cursor colour) — the [cursor] section
# only accepts style/blink options, not colours
cursor=1e1e2e 89b4fa
