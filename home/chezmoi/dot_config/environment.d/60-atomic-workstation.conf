# ~/.config/environment.d/60-atomic-workstation.conf
#
# Port of home-manager's sessionVariables + PATH handling (main branch):
# EDITOR/VISUAL=hx and ~/.local/bin (GitHub-release apps) for every systemd
# user session — GUI apps included, which fish/bash init files never reach.
#
# Homebrew's bin dirs are appended here as well. Bazzite's
# /usr/share/fish/vendor_conf.d/ublue-brew.fish only does this for INTERACTIVE
# fish, so without these two entries every non-interactive shell, every
# systemd --user service (niri, noctalia, magpie, Lody, pi) and anything a
# desktop file launches sees no hx/jj/rg/fd/go/node.
#
# Brew goes AFTER the system paths on purpose (same reasoning as ublue's
# fish snippet): a brew `dbus`/`just`/`fish` must not shadow the image's own.
# environment.d has no shell evaluation — only ${VAR} substitution is allowed.

PATH=${HOME}/.local/bin:${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
EDITOR=hx
VISUAL=hx
