# ~/.config/environment.d/60-atomic-workstation.conf
#
# Port of home-manager's sessionVariables + PATH handling (main branch):
# EDITOR/VISUAL=hx and ~/.local/bin (GitHub-release apps) for every
# systemd user session — GUI apps included, which fish/bash init files
# never reach.

PATH=${HOME}/.local/bin:${PATH}
EDITOR=hx
VISUAL=hx
