# ~/.config/sway/conf.d/00-defaults.conf — atomic-workstation
#
# This file exists so that the include at the bottom of
# ~/.config/sway/config always matches at least one file:
#
#     include ~/.config/sway/conf.d/*.conf
#
# DROP-IN MECHANISM (for machine-specific settings chezmoi should not own):
#   create more files here, they are loaded in filename order, last wins.
#
#        10-monitors.conf    output DP-1 mode 2560x1440@60Hz position 0,0
#        20-input.conf       input "type:keyboard" xkb_layout us
#        30-nvidia.conf      (NVIDIA workarounds, see docs/installation.md)
#
# chezmoi manages THIS file only; anything else you add is yours and will
# not be touched by "chezmoi apply". Files here are never committed.
