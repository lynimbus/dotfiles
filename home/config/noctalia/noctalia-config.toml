# Noctalia 配置 —— 移植自上游 NyxNiri (github.com/ech678/NyxNiri) 的
# configs/noctalia/noctalia-config.toml，适配本机：
#   - 去掉 mpvpaper / echolyrics 插件相关段（本机未安装对应插件）
#   - 去掉 nyxmellow(fcitx5) 模板注册（fcitx5 主题文件未随本仓部署）
#   - 去掉 theme_mode_changed / wallpaper_changed hooks（对应脚本未部署）
#   - 去掉 shell.greeter_sync（本机用 SDDM，没有 greetd）
#   - 壁纸目录指向 ~/Pictures/Wallpapers（放壁纸后重启 noctalia 或
#     `noctalia msg config-reload` 生效；没有目录时用内置默认壁纸）
# 由 home-manager programs.noctalia.settings 托管，经 `noctalia config
# validate` 校验后写入 ~/.config/noctalia/config.toml。

[audio]
enable_overdrive = true

[backdrop]
blur_intensity = 0.68999998457729816
tint_intensity = 0.0

[bar]
order = ["bar"]

[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline"
capsule_foreground = "secondary"
capsule_opacity = 0.79
capsule_padding = 10.0
capsule_radius = 80
capsule_thickness = 0.95999998226761818
enabled = true
panel_overlap = 12
font_family = "JetBrains Mono"
margin_ends = 14
margin_edge = 10
scale = 1.1
shadow = false
end = [
    "media",
    "tray",
    "wallpaper",
    "volume",
    "notifications",
    "session",
]
center = ["clock"]
start = ["launcher", "workspaces", "active_window"]
thickness = 36

[brightness]
enable_ddcutil = false

[desktop_widgets]
schema_version = 2
widget_order = ["desktop-widget-0000000000000003"]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[desktop_widgets.widget.desktop-widget-0000000000000003]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 720.0
rotation = 0.0
type = "fancy_audio_visualizer"

[desktop_widgets.widget.desktop-widget-0000000000000003.settings]
background = false
visualization_mode = "wave_rings"

[dock]
auto_hide = false
enabled = true
margin_edge = 10
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 360.0

[hot_corners.bottom_right]
action = "window_switcher"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[location]
custom_schedule = false

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[osd]
background_opacity = 0.84999998100101948
offset_y = 20
position = "bottom_center"
scale = 0.90000000596046448

[osd.kinds]
media = false
nightlight = false

[shell]
font_family = "Noto Sans CJK SC"
polkit_agent = true
settings_show_advanced = true

[shell.panel]
control_center_placement = "floating"
control_center_position = "top_right"
session_placement = "floating"
session_position = "center"
transparency_mode = "soft"
wallpaper_placement = "floating"
wallpaper_position = "center"

[[shell.session.actions]]
action = "lock"
countdown_seconds = 0.0
enabled = true
shortcut = "1"
variant = "default"

[[shell.session.actions]]
action = "logout"
countdown_seconds = 0.0
enabled = true
shortcut = "2"
variant = "default"

[[shell.session.actions]]
action = "lock_and_suspend"
countdown_seconds = 0.0
enabled = true
shortcut = "3"
variant = "default"

[[shell.session.actions]]
action = "reboot"
countdown_seconds = 0.0
enabled = true
shortcut = "4"
variant = "default"

[[shell.session.actions]]
action = "shutdown"
countdown_seconds = 0.0
enabled = true
shortcut = "5"
variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "auto"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
builtin_ids = ["kitty", "qt", "starship"]
community_ids = []

# GTK Material You 主题（上游移植自 HyprYou）：由 Noctalia 在壁纸/明暗切换时
# 渲染到 ~/.config/gtk-{3,4}.0/gtk.css。模板源文件由 home-manager 托管在
# ~/.config/noctalia/templates/（见 home/flakeos.nix 的 xdg.configFile 块）。
[theme.templates.user.nyxniri_gtk3]
index = 3
input_path = "/home/lynimbus/.config/noctalia/templates/gtk-3.0.css"
output_path = "/home/lynimbus/.config/gtk-3.0/gtk.css"

[theme.templates.user.nyxniri_gtk4]
index = 4
input_path = "/home/lynimbus/.config/noctalia/templates/gtk-4.0.css"
output_path = "/home/lynimbus/.config/gtk-4.0/gtk.css"

[wallpaper]
directory = "~/Pictures/Wallpapers"
fill_mode = "crop"

[widget.active_window]
min_length = 0

[widget.clock]
format = "{:%a, %d %b %H:%M}"

[widget.tray]
detached_panel = true
drawer = true
