# 特效
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.95
blur_params_contrast=0.95
blur_params_saturation=1.0

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=8
shadows_blur=18
shadows_position_x=0
shadows_position_y=3
shadows_color=0x00000080

border_radius=12
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000033

# 动画
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.92
zoom_end_ratio=0.92
fade_in_begin_opacity=0.9
fade_out_begin_opacity=0.9
animation_duration_move=320
animation_duration_open=260
animation_duration_tag=220
animation_duration_close=180
animation_duration_focus=120
animation_curve_open=0.16,1,0.3,1
animation_curve_move=0.16,1,0.3,1
animation_curve_tag=0.16,1,0.3,1
animation_curve_close=0.4,0,0.2,1
animation_curve_focus=0.4,0,0.2,1
animation_curve_opacity_fade_in=0.16,1,0.3,1
animation_curve_opacity_fade_out=0.4,0,0.2,1
tag_animation_direction=1

# 几何
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=12
gap_outer_vertical=12
border_px=2
smart_gaps=0

# 外观（颜色由 noctalia 在末尾覆盖）
root_color=0x101014ff
border_color=0x3a3a44ff
focus_color=0x8ab4f8ff
urgent_color=0xff6b6bff
maximized_screen_color=0x8ab4f8ff
scratchpad_color=0x8ab4f8ff
global_color=0x8ab4f8ff
overlay_color=0x8ab4f8ff
drop_color=0x8ab4f880
split_color=0xff6b6bff
cursor_size=24

# 布局
circle_layout=fair,tile
scroller_structs=20
scroller_default_proportion=0.8
scroller_proportion_preset=0.5,0.8,1.0
new_is_master=1
default_master_factor=0.55
default_master_count=1
dwindle_split_ratio=0.5
dwindle_smart_split=1
dwindle_drop_simple_split=1
dwindle_preserve_split=1
monocle_tab_mode=1
monocle_no_gap=0

# 概览
enable_hotarea=0
overview_gap_inner=8
overview_gap_outer=32
title_message_bar_height=44
title_message_bar_gap=16

# 行为
tag_num=6
sloppy_focus=0
warp_cursor=1
focus_on_activate=1
focus_cross_monitor=0
focus_cross_tag=0
view_current_to_back=1
enable_floating_snap=1
snap_distance=24
drag_tile_to_tile=1
drag_tile_small=1
enable_border_resize=1
auto_reload_config=1
xwayland_persistence=1
allow_tearing=2
idle_inhibit_when_fullscreen=0

# 键盘与指针
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us
disable_trackpad=0
trackpad_send_events_mode=2
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0

source=./mango-hardware.conf
source=./rules.conf
source=./binds.conf

exec_once=noctalia

# 颜色跟随 noctalia 主题
source=~/.config/mango/noctalia.conf
