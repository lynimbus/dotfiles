# 终端与启动器
bind=SUPER,Return,spawn,ghostty
bind=SUPER+SHIFT,Return,toggle_named_scratchpad,com.mitchellh.ghostty.scratch,none,ghostty --class=com.mitchellh.ghostty.scratch
bind=SUPER,Space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,D,spawn,noctalia msg panel-toggle launcher
bind=NONE,XF86Search,spawn,noctalia msg panel-toggle launcher
bind=SUPER,B,spawn,chromium

# 窗口
bind=SUPER,Q,killclient
bind=SUPER,V,togglefloating
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER+SHIFT,G,toggleglobal
bind=SUPER+ALT,O,toggleoverlay
bind=SUPER,minus,minimized
bind=SUPER,equal,restore_minimized
bind=SUPER+SHIFT,P,sleep_toggle_monitor,eDP-1

# 焦点
bind=SUPER,H,focusdir,left
bind=SUPER,J,focusdir,down
bind=SUPER,K,focusdir,up
bind=SUPER,L,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER+ALT,grave,focuslast

# 移动窗口
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,J,move_client,down
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+CTRL,H,exchange_client,left
bind=SUPER+CTRL,J,exchange_client,down
bind=SUPER+CTRL,K,exchange_client,up
bind=SUPER+CTRL,L,exchange_client,right

# dwindle
bind=SUPER,BackSpace,dwindle_toggle_current_split
bind=SUPER+SHIFT,BackSpace,dwindle_toggle_split_direction

# 布局与尺寸
bind=SUPER,N,switch_layout
bind=SUPER,M,setmfact,+0.05
bind=SUPER+SHIFT,M,setmfact,-0.05
bind=SUPER+ALT,equal,incgaps,1
bind=SUPER+ALT,minus,incgaps,-1
bind=SUPER+ALT,g,togglegaps

# 标签
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER,U,viewtoleft,0
bind=SUPER,I,viewtoright,0
bind=SUPER+CTRL,U,tagtoleft,0
bind=SUPER+CTRL,I,tagtoright,0
bind=SUPER+SHIFT,U,toggleview,1
bind=SUPER,grave,toggle_special_tag

# 概览与切换器
bind=SUPER,O,overcircle,current_next
bind=SUPER+SHIFT,O,toggleoverview,1
bind=SUPER+ALT,Tab,switcher,all_tag_next

# noctalia
bind=SUPER,S,spawn,noctalia msg panel-toggle control-center
bind=SUPER,E,spawn,noctalia msg panel-toggle session
bind=SUPER+SHIFT,V,spawn,noctalia msg panel-toggle clipboard
bind=CTRL+ALT,L,spawn,noctalia msg session lock

# 媒体与亮度
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioStop,spawn,noctalia msg media pause
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86KbdBrightnessUp,spawn,kbd-backlight 10%+
bind=NONE,XF86KbdBrightnessDown,spawn,kbd-backlight 10%-

# 截图
bind=NONE,Print,spawn,screenshot

# 系统
bind=SUPER,R,reload_config
bind=SUPER+SHIFT,R,quit
bind=SUPER+CTRL,Delete,quit
bind=SUPER,Escape,toggle_trackpad_enable

# 指针
mousebind=SUPER,btn_left,moveresize,curmove

# 触控板手势
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# 滚轮切换标签
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# 调整模式
key_mode=resize
bind=NONE,Left,resizewin,-40,0
bind=NONE,Right,resizewin,+40,0
bind=NONE,Up,resizewin,0,-40
bind=NONE,Down,resizewin,0,+40
bind=NONE,Escape,setkeymode,default
bind=NONE,Return,setkeymode,default
