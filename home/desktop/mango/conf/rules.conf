# One fair layout for every tag
tag_rule=id:*,layout_name:fair

# 1: terminal
window_rule=tags:1,app_id=^com\.mitchellh\.ghostty$
window_rule=tags:1,app_id:org.wezfurlong.wezterm
window_rule=tags:1,app_id:Alacritty

# 2: browser
window_rule=tags:2,app_id:firefox
window_rule=tags:2,app_id:google-chrome
window_rule=tags:2,app_id:librewolf
window_rule=tags:2,app_id:chromium-browser

# 3: chat
window_rule=tags:3,title:^Telegram
window_rule=tags:3,app_id:wechat
window_rule=tags:3,app_id:QQ
window_rule=tags:3,app_id:com.ayugram.desktop

# 4: entertainment
window_rule=tags:4,app_id:steam
window_rule=tags:4,app_id:steam_app_default
window_rule=tags:4,app_id:heroic
window_rule=tags:4,app_id:net.lutris.Lutris
window_rule=tags:4,app_id:com.vysp3r.ProtonPlus
window_rule=tags:4,app_id:^moe.launcher
window_rule=tags:4,app_id:.exe$
window_rule=tags:4,app_id:^mpv$

# 5: utilities
window_rule=tags:5,app_id:com.github.johnfactotum.Foliate
window_rule=tags:5,app_id:io.github.lgse.Strata
window_rule=tags:5,app_id:^clash-verge$
window_rule=tags:5,app_id:^\.clash-verge-wrapped$
window_rule=tags:5,app_id:^org.kde.easyeffects$

# 6: everything else
window_rule=tags:6,app_id:BambuStudio
window_rule=tags:6,app_id:OrcaSlicer
window_rule=tags:6,app_id:Zoom Workplace
window_rule=tags:6,app_id:^Zoom$

# The floating terminal scratchpad
window_rule=is_named_scratchpad:1,width:1000,height:640,app_id:com.mitchellh.ghostty.scratch

# The screenshot selection area skips blur and animation
layer_rule=no_animation:1,no_blur:1,layer_name:selection

# noctalia panels keep their own opening animation
layer_rule=animation_type_open:zoom,animation_type_close:fade,layer_name:^noctalia
