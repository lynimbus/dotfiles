[audio]
enable_overdrive = true

[backdrop]
enabled = true
blur_intensity = 0.72
tint_intensity = 0.08

[bar]
order = ["bar"]

[bar.bar]
background_opacity = 0.0
border_width = 0.0
capsule = true
capsule_border = "outline_variant"
capsule_border_width = 1.0
capsule_fill = "surface_container"
capsule_foreground = "on_surface"
capsule_opacity = 0.88
capsule_padding = 10.0
capsule_thickness = 0.9
enabled = true
font_family = "Rubik"
font_weight = 600
margin_ends = 10
margin_edge = 8
padding = 4
radius = 19
thickness = 38
widget_spacing = 8
shadow = false
contact_shadow = false
start = ["launcher", "workspaces", "group:sys"]
center = ["clock"]
end = ["media", "group:status", "session"]

[[bar.bar.capsule_group]]
enabled = true
border = "outline_variant"
border_width = 1.0
fill = "surface_container"
foreground = "secondary"
id = "sys"
members = ["sysmon", "ram"]
opacity = 0.88
padding = 10.0

[[bar.bar.capsule_group]]
enabled = true
border = "outline_variant"
border_width = 1.0
fill = "surface_container"
foreground = "on_surface"
id = "status"
members = ["volume", "tray", "notifications"]
opacity = 0.88
padding = 10.0

[brightness]
enable_ddcutil = false

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [
    "m3_cookie_clock",
    "m3_media",
    "m3_lyrics",
    "m3_resources",
    "m3_calendar",
    "m3_user_card",
    "m3_visualizer",
]

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = false

[desktop_widgets.widget.m3_cookie_clock]
box_height = 0.0
box_width = 0.0
cx = 172.0
cy = 113.0
output = "eDP-1"
rotation = 0.0
type = "lynimbus/m3-expressive:cookie_clock"

[desktop_widgets.widget.m3_cookie_clock.settings]
background = false

[desktop_widgets.widget.m3_media]
box_height = 108.0
box_width = 336.0
cx = 731.0
cy = 842.0
output = "eDP-1"
rotation = 0.0
type = "media_player"

[desktop_widgets.widget.m3_media.settings]
album_art_background = true
album_art_blur = 28
audio_visualizer = true
background = true
background_color = "surface"
background_opacity = 0.86
background_padding = 12.0
background_radius = 6.0
hide_when_no_media = true
layout = "horizontal"
shadow = false

[desktop_widgets.widget.m3_lyrics]
box_height = 0.0
box_width = 0.0
cx = 731.0
cy = 746.0
output = "eDP-1"
rotation = 0.0
type = "noctalia/lyrics:desktop"

[desktop_widgets.widget.m3_lyrics.settings]
active_color = "primary"
background = false
color = "on_surface"
font_size = 16
hide_when_idle = true
hide_when_no_media = true
line_count = 3
shadow = true
width = 520

[desktop_widgets.widget.m3_resources]
box_height = 0.0
box_width = 0.0
cx = 172.0
cy = 842.0
output = "eDP-1"
rotation = 0.0
type = "lynimbus/m3-expressive:resources"

[desktop_widgets.widget.m3_resources.settings]
background = false

[desktop_widgets.widget.m3_calendar]
box_height = 0.0
box_width = 0.0
cx = 1290.0
cy = 113.0
output = "eDP-1"
rotation = 0.0
type = "lynimbus/m3-expressive:calendar"

[desktop_widgets.widget.m3_calendar.settings]
background = false

[desktop_widgets.widget.m3_user_card]
box_height = 0.0
box_width = 0.0
cx = 1290.0
cy = 842.0
output = "eDP-1"
rotation = 0.0
type = "lynimbus/m3-expressive:user_card"

[desktop_widgets.widget.m3_user_card.settings]
background = false

[desktop_widgets.widget.m3_visualizer]
box_height = 56.0
box_width = 740.0
cx = 731.0
cy = 872.0
output = "eDP-1"
rotation = 0.0
type = "audio_visualizer"

[desktop_widgets.widget.m3_visualizer.settings]
background = false
bands = 64
centered = false
color_1 = "primary"
color_2 = "tertiary"
mirrored = true
show_when_idle = false

[dock]
auto_hide = true
background_opacity = 0.86
border = "outline_variant"
border_width = 1.0
enabled = true
icon_size = 44
magnification = true
magnification_scale = 1.35
margin_edge = 10
radius = 28
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = false

[hot_corners]
enabled = true

[hot_corners.bottom_right]
action = "window_switcher"

[idle]
behavior_order = ["lock", "screen-off", "lock-and-suspend"]

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 300.0

[idle.behavior.lock-and-suspend]
action = "lock_and_suspend"
enabled = true
timeout = 900.0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 360.0

[location]
custom_schedule = false

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = []

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[nightlight]
enabled = false
temperature_day = 6500
temperature_night = 5500

[notification]
background_opacity = 0.92
border = true
border_color = "outline_variant"
border_width = 1.0

[osd]
background_opacity = 0.88
border = true
border_color = "outline_variant"
border_width = 1.0
offset_y = 22
position = "bottom_center"
scale = 0.92

[osd.kinds]
media = false
nightlight = false

[plugin_settings."noctalia/mpvpaper"]
mpv_options = "no-config profile=fast load-scripts=no no-save-position-on-quit no-resume-playback"
video_directory = "~/.local/share/noctalia/wallpapers"

[plugins]
enabled = [
    "lynimbus/m3-expressive",
    "noctalia/lyrics",
    "noctalia/mpvpaper",
]

[shell]
button_borders = false
card_borders = false
corner_radius_scale = 1.5
font_family = "Rubik"
input_borders = true
polkit_agent = true
popup_borders = true
settings_show_advanced = true
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

[shell.greeter_sync]
auto_sync = true

[shell.panel]
border_color = "outline_variant"
border_width = 1.0
borders = true
control_center_placement = "floating"
control_center_position = "top_right"
floating_offset = 10
launcher_placement = "floating"
launcher_position = "center"
list_item_background = true
session_placement = "floating"
session_position = "center"
shadow = true
transparency_mode = "soft"

[shell.screen_corners]
enabled = true
size = 20

[shell.screenshot]
annotate = true
close_on_copy = true
close_on_save = true
copy_to_clipboard = true
directory = "~/Pictures/Screenshots"
save_to_file = true

[theme]
builtin = "Ayu"
community_palette = "One Dark Two"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["umbriel", "mango", "luciole", "gtk3", "gtk4"]

[theme.templates.user.umbriel_gtk4]
index = 1
input_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/gtk4-input.css"
output_path = "$XDG_CONFIG_HOME/gtk-4.0/umbriel.css"
hook_async = false
pre_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk4-input.sh\" > /dev/null"
post_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk4-apply.sh\""

[theme.templates.user.umbriel_gtk4_extras]
index = 2
input_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/gtk4-extras-input.css"
output_path = "$XDG_CONFIG_HOME/gtk-4.0/umbriel-extras.css"
hook_async = false
pre_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk4-input.sh\" > /dev/null"
post_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk4-apply.sh\""

[theme.templates.user.umbriel_gtk3]
index = 3
input_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/gtk3-buttons-input.css"
output_path = "$XDG_CONFIG_HOME/gtk-3.0/colors.css"
hook_async = false
pre_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk3-input.sh\" > /dev/null"
post_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk3-apply.sh\""

[theme.templates.user.umbriel_gtk3_extras]
index = 4
input_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/gtk3-extras-input.css"
output_path = "$XDG_CONFIG_HOME/gtk-3.0/colors-extras.css"
hook_async = false
pre_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk3-input.sh\" > /dev/null"
post_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/gtk3-apply.sh\""

[theme.templates.user.umbriel_firefox_buttons]
index = 5
input_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/firefox-buttons-input.css"
output_path = "$XDG_CACHE_HOME/noctalia/umbriel-gtk/firefox-buttons.css"
hook_async = false
pre_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/firefox-input.sh\" > /dev/null"
post_hook = "bash \"$HOME/.config/noctalia/templates/umbriel-gtk/firefox-apply.sh\""

[theme.templates.user.fcitx5_mellow_panel]
index = 6
input_path = "~/.config/noctalia/templates/fcitx5-mellow/panel.svg"
output_path = "$XDG_DATA_HOME/fcitx5/themes/noctalia-mellow/panel.svg"

[theme.templates.user.fcitx5_mellow_highlight]
index = 7
input_path = "~/.config/noctalia/templates/fcitx5-mellow/highlight.svg"
output_path = "$XDG_DATA_HOME/fcitx5/themes/noctalia-mellow/highlight.svg"

[theme.templates.user.fcitx5_mellow_conf]
index = 8
input_path = "~/.config/noctalia/templates/fcitx5-mellow/theme.conf"
output_path = "$XDG_DATA_HOME/fcitx5/themes/noctalia-mellow/theme.conf"
hook_async = false
post_hook = "bash \"$HOME/.config/noctalia/templates/fcitx5-mellow/apply.sh\" && busctl --user --auto-start=no call org.fcitx.Fcitx5 /controller org.fcitx.Fcitx.Controller1 ReloadAddonConfig s classicui >/dev/null 2>&1 || true"

[widget.active_window]
min_length = 0

[widget.clock]
capsule_fill = "surface_container_high"
capsule_foreground = "on_surface"
font_weight = 700
format = "{:%a %d/%m  %H:%M}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.launcher]
capsule_border_width = 0.0
capsule_fill = "primary_container"
capsule_foreground = "on_primary_container"

[widget.media]
capsule_border_width = 0.0
capsule_fill = "secondary_container"
capsule_foreground = "on_secondary_container"
hide_when_no_media = true
max_length = 180

[widget.ram]
show_glyph = false
visualization = "none"

[widget.session]
capsule_border_width = 0.0
capsule_fill = "tertiary_container"
capsule_foreground = "on_tertiary_container"

[widget.sysmon]
glyph = "cpu"
visualization = "none"

[widget.tray]
detached_panel = true
drawer = true
pinned = [
    "qq",
    "AyuGramDesktop",
    "MyGo Music",
    "Antigravity",
    "kero-kero",
    "magpie",
    "wechat",
]

[widget.workspaces]
active_pill_size = 2.4
empty_color = "surface_container_high"
focused_color = "primary"
inactive_pill_size = 1.0
label_source = "id"
occupied_color = "secondary_container"
show_labels = true
style = "regular"
urgent_color = "error"
