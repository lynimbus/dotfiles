<svg xmlns="http://www.w3.org/2000/svg" width="31" height="31" viewBox="0 0 31 31">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feFlood flood-opacity="0.45" flood-color="#000000" result="flood"/>
      <feComposite in="flood" in2="SourceGraphic" operator="in" result="composite"/>
      <feGaussianBlur in="composite" stdDeviation="1.5" result="blur"/>
      <feOffset dx="1.4" dy="1.4" result="offset"/>
      <feComposite in="SourceGraphic" in2="offset" operator="over"/>
    </filter>
  </defs>
  <rect x="5.75" y="5.75" width="19.5" height="19.5" rx="9.75" ry="9.75"
        fill="{{ colors.surface_container.default.hex }}"
        stroke="{{ colors.outline_variant.default.hex }}"
        stroke-width="0.75" stroke-opacity="0.75" filter="url(#shadow)"/>
</svg>
