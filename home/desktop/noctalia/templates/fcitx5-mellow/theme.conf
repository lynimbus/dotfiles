[Metadata]
Name=Noctalia Mellow
Version=1
Author=Noctalia
Description=Noctalia palette fcitx5 theme based on mellow.

[InputPanel]
EnableBlur=False
NormalColor={{ colors.on_surface.default.hex }}
HighlightCandidateColor={{ colors.on_primary.default.hex }}
HighlightColor={{ colors.on_primary.default.hex }}
HighlightBackgroundColor={{ colors.primary.default.hex }}
FullWidthHighlight=True

[InputPanel/Background]
Image=panel.svg
Color={{ colors.surface_container.default.hex }}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Background/Margin]
Left=15
Right=15
Top=15
Bottom=15

[InputPanel/Highlight]
Image=highlight.svg
Color={{ colors.primary.default.hex }}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=15
Right=15
Top=10
Bottom=10

[InputPanel/ContentMargin]
Left=9
Right=9
Top=7
Bottom=6

[InputPanel/TextMargin]
Left=9
Right=9
Top=6
Bottom=7

[Menu]
NormalColor={{ colors.on_surface.default.hex }}
HighlightCandidateColor={{ colors.on_primary.default.hex }}
Spacing=0

[Menu/Background]
Image=panel.svg
Color={{ colors.surface_container.default.hex }}
BorderColor=#00000000
BorderWidth=0

[Menu/Background/Margin]
Left=11
Right=11
Top=11
Bottom=11

[Menu/Highlight]
Image=highlight.svg
Color={{ colors.primary.default.hex }}
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=5
Right=5
Top=5
Bottom=5

[Menu/Separator]
Color={{ colors.outline_variant.default.hex }}
