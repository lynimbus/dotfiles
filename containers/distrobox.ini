# atomic-workstation — declarative distrobox containers
#
# This file is the DESIRED state for dev containers. It is consumed by
# `distrobox assemble create` (run by containers/restore.sh, which only
# creates what is missing — it never destroys existing containers).
#
# Format: https://distrobox.it/usage/distrobox-assemble/
# Section name = container name. Bootstrap scripts live in
# containers/bootstrap/<name>.sh and run inside the container after creation.

[fedora-dev]
# Match the Fedora release your Bazzite image tracks (stable ≈ latest-1).
image=registry.fedoraproject.org/fedora-toolbox:42
# NOTE on java: Fedora 42+ dropped java-17-* entirely (only java-21,
# java-25 and java-latest remain). A stale java-17-openjdk-devel makes
# `dnf install` fail with "No match for argument", which aborts the WHOLE
# bootstrap and leaves the container without any of the packages below. Use
# the current LTS JDK (21). r8/d8 on the host are separate and unaffected.
additional_packages="git git-lfs neovim helix ripgrep fd fzf jq eza bat python3-pip nodejs golang zig java-21-openjdk-devel"
init=false
nvidia=false
pull=true
root=false
start_now=false

# Example: an Ubuntu container for cross-distro builds
#
# [ubuntu-build]
# image=ubuntu:24.04
# additional_packages="build-essential"
# init=false
# pull=true
# start_now=false
